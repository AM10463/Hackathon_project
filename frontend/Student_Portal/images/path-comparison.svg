<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc"><title id="title">Certificate path compared with skill-first path</title><desc id="desc">A visual comparison between a certificate-only path and a skill-first path.</desc><rect width="1200" height="420" rx="28" fill="#0f172a"/><text x="74" y="74" font-family="sans-serif" font-size="24" font-weight="700" fill="#fca5a5">CERTIFICATES ONLY</text><text x="680" y="74" font-family="sans-serif" font-size="24" font-weight="700" fill="#6ee7b7">SKILL-FIRST</text><path d="M100 150h420M100 250h420M100 350h420" stroke="#475569" stroke-width="4"/><path d="M700 350C800 310 770 250 850 230s50-100 150-80 80-52 130-60" fill="none" stroke="#10b981" stroke-width="12" stroke-linecap="round"/><circle cx="120" cy="150" r="18" fill="#ef4444"/><circle cx="270" cy="250" r="18" fill="#ef4444"/><circle cx="440" cy="350" r="18" fill="#ef4444"/><circle cx="700" cy="350" r="18" fill="#60a5fa"/><circle cx="850" cy="230" r="18" fill="#60a5fa"/><circle cx="1000" cy="150" r="18" fill="#10b981"/><circle cx="1130" cy="90" r="18" fill="#10b981"/><text x="100" y="397" font-family="sans-serif" font-size="18" fill="#cbd5e1">Hard to prove readiness</text><text x="700" y="397" font-family="sans-serif" font-size="18" fill="#a7f3d0">Skills, feedback, opportunity</text></svg>
