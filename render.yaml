services:
  - type: web
    name: skillbridge-portal
    runtime: python
    plan: free
    buildCommand: pip install -r academia_industry_portal/backend/requirements.txt
    startCommand: cd academia_industry_portal/backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: SECRET_KEY
        generateValue: true
